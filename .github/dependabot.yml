version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    # Hold TypeScript 7: typescript-eslint (8.72, latest as of 2026-10-23) peers on
    # typescript <6.1.0, so TS 7 fails npm install (ERESOLVE) and the build.
    # Remove this ignore once a typescript-eslint release supports TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    # Hold TypeScript 7: typescript-eslint (8.72, latest as of 2026-10-23) peers on
    # typescript <6.1.0, so TS 7 fails npm install (ERESOLVE) and the build.
    # Remove this ignore once a typescript-eslint release supports TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "uv"
    directory: "/tui"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
